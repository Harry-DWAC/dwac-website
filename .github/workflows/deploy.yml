name: Build and Deploy

on:
  push:
    branches: [main, Harry-dwac]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js site
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      # 静态守卫：死链 / 色阶 / 重定向跳数 / CSP 白名单与凭据。
      # 这些问题的共同点是"构建成功、线上静默出错"（例：评论板被 CSP 拦死 3 周、
      # Agent API Key 被硬编码进产物并随公开仓库泄露），所以必须在产物上对账。
      - name: Static guards (links / colors / redirects / CSP)
        run: npm run check

      # 说明：线上由 Vercel 承载（响应头 server: Vercel），这里不再向 GitHub Pages 发布。
      # 原 peaceiris/actions-gh-pages 步骤依赖缺失的 secrets.PERSONAL_TOKEN，
      # 自 2026-09-19 起每次 run 都在最后一步失败 —— 构建与守卫全绿、仅部署红，
      # 长期红点会掩盖真正的失败信号；而 gh-pages 那侧因仓库 CNAME=dwac.net
      # 只会 301 回本站，属无用镜像。
